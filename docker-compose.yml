version: "3.9"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     agetbazar
      POSTGRES_PASSWORD: agetbazar_dev
      POSTGRES_DB:       agetbazar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agetbazar"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
